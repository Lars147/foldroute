<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6f3" />
    <style id="startup-styles">
      :root {
        --startup-paper: #f5f6f3;
        --startup-ink: #171a1c;
        background: var(--color-canvas, var(--startup-paper));
      }
      :root[data-theme="dark"] {
        --startup-paper: #101314;
        --startup-ink: #f5f6f3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --startup-paper: #101314;
          --startup-ink: #f5f6f3;
        }
      }
      #app-startup {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--color-canvas, var(--startup-paper));
        color: var(--color-text, var(--startup-ink));
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      :root[data-standalone] body[data-starting] #app-startup,
      body[data-startup-error] #app-startup,
      #app-startup[data-exiting] {
        display: flex;
      }
      @media (display-mode: standalone) {
        body[data-starting] #app-startup {
          display: flex;
        }
      }
      #app-startup[hidden] {
        display: none;
      }
      .startup-scene {
        /* Outer wheel radius: (125 + 42 / 2) * 128 / 1024 = 18.25 px. */
        --startup-wheel-travel: 114.668px;
        position: relative;
        width: min(320px, calc(100vw - 48px));
        height: 128px;
      }
      .startup-mark {
        position: relative;
        margin-inline: auto;
      }
      .startup-mark,
      .startup-mark svg {
        display: block;
        width: 128px;
        height: 128px;
      }
      #app-startup [data-fold] {
        transform-box: view-box;
        /* Shared hinge at (520, 545) in the 1024-square SVG. */
        transform-origin: 50.78125% 53.22265625%;
      }
      #app-startup [data-wheel] {
        transform-box: fill-box;
        transform-origin: center;
      }
      .startup-road {
        position: absolute;
        inset: 104.5px 0 auto;
        height: 16px;
        overflow: hidden;
        opacity: 0.45;
        clip-path: inset(0 0 0 100%);
      }
      .startup-road-track {
        display: block;
        width: calc(100% + var(--startup-wheel-travel));
        height: 16px;
      }
      :root[data-startup-motion] #app-startup [data-fold] {
        animation: startup-fold-rear 480ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      :root[data-startup-motion] #app-startup [data-fold="front"] {
        animation-name: startup-fold-front;
      }
      :root[data-startup-motion] #app-startup .startup-road {
        animation: startup-road-arrive 160ms ease-out 640ms both;
      }
      :root[data-startup-motion] #app-startup [data-wheel] {
        animation: startup-wheel-turn 900ms linear 800ms infinite both;
      }
      :root[data-startup-motion] #app-startup .startup-road-track {
        animation: startup-road-travel 900ms linear 800ms infinite both;
      }
      @keyframes startup-fold-rear {
        0%,
        100% {
          transform: none;
        }
        42% {
          transform: rotate(-10deg) scaleX(0.9);
        }
      }
      @keyframes startup-fold-front {
        0%,
        100% {
          transform: none;
        }
        42% {
          transform: rotate(12deg) scaleX(0.86);
        }
      }
      @keyframes startup-road-arrive {
        to {
          clip-path: inset(0);
        }
      }
      @keyframes startup-wheel-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes startup-road-travel {
        to {
          transform: translateX(calc(-1 * var(--startup-wheel-travel)));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        :root[data-startup-motion]
          #app-startup
          :is([data-fold], [data-wheel], .startup-road, .startup-road-track) {
          animation: none;
        }
      }
      .startup-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #startup-error {
        max-width: 300px;
        padding: 0 20px;
        text-align: center;
      }
      #startup-error[hidden] {
        display: none;
      }
      #startup-reload {
        min-height: 48px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: var(--color-brand, #ffd43b);
        color: var(--color-on-brand, #171a1c);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      #startup-reload:focus-visible {
        outline: 2px solid var(--startup-ink);
        outline-offset: 4px;
      }
      #app-startup[data-exiting] {
        pointer-events: none;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let preference = "system";
        try {
          preference = localStorage.getItem("foldroute.appearance") || "system";
        } catch {}
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          preference === "light" || preference === "dark"
            ? preference
            : dark
              ? "dark"
              : "light";
        root.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          getComputedStyle(root).getPropertyValue("--startup-paper").trim();
        if (
          matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true
        )
          root.dataset.standalone = "";
        let firstFrame;
        const fail = () => {
          if (
            !document.body?.hasAttribute("data-starting") ||
            document.body.hasAttribute("data-startup-error")
          )
            return;
          cancelAnimationFrame(firstFrame);
          delete root.dataset.startupMotion;
          document.body.dataset.startupError = "";
          document.getElementById("startup-status").hidden = true;
          document.getElementById("startup-error").hidden = false;
          window.dispatchEvent(new Event("foldroute:startup-failed"));
        };
        window.addEventListener("foldroute:startup-error", fail);
        window.addEventListener(
          "error",
          (event) => {
            if (
              event instanceof ErrorEvent ||
              event.target instanceof HTMLScriptElement
            )
              fail();
          },
          true,
        );
        document.addEventListener("click", (event) => {
          if (
            event.target instanceof Element &&
            event.target.closest("#startup-reload")
          )
            location.reload();
        });
        if (root.hasAttribute("data-standalone")) {
          const recordVisibleFrame = () => {
            const mark = document.querySelector(
              "#app-startup .startup-mark svg",
            );
            if (
              document.visibilityState === "visible" &&
              mark?.getClientRects().length
            ) {
              root.dataset.startupVisibleAt = String(performance.now());
              if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
                root.dataset.startupMotion = "";
              window.dispatchEvent(new Event("foldroute:startup-visible"));
            } else {
              firstFrame = requestAnimationFrame(recordVisibleFrame);
            }
          };
          firstFrame = requestAnimationFrame(recordVisibleFrame);
        }
      })();
    </script>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Mit Faltrad und ÖPNV unterwegs. Route planen und die letzte Reise offline mitnehmen."
    />
    <link rel="icon" href="foldroute-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>FoldRoute · Route planen</title>
  </head>
  <body data-view="search" data-starting>
    <div id="app-startup" aria-label="FoldRoute startet">
      <div class="startup-scene" aria-hidden="true">
        <div class="startup-road">
          <svg class="startup-road-track" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern
                id="startup-road-pattern"
                width="114.668"
                height="16"
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M0 .75H114.668M8 7H20M47 11H53M81 6H94"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </pattern>
            </defs>
            <rect
              width="100%"
              height="100%"
              fill="url(#startup-road-pattern)"
            />
          </svg>
        </div>
        <div class="startup-mark">
          <!-- startup-mark -->
        </div>
      </div>
      <p id="startup-status" class="startup-sr-only" role="status">
        FoldRoute wird gestartet.
      </p>
      <div id="startup-error" hidden>
        <p role="alert">FoldRoute konnte nicht gestartet werden.</p>
        <button id="startup-reload" type="button">Neu laden</button>
      </div>
    </div>
    <noscript><p>Für die Routenplanung wird JavaScript benötigt.</p></noscript>
    <div id="app-root" style="display: contents"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
